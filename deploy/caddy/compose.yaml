# Proxy central opcional, separado del proyecto. No levantar otro si ya existe uno.
name: proxy-central
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dazgreen_edge
networks:
  dazgreen_edge:
    external: true
    name: dazgreen_edge
volumes:
  caddy_data:
  caddy_config:
